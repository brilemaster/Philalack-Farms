<style>

  #top button{font-size:16px;padding:3px 7px;min-width:40px;min-height:38px}}

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="ctl left" id="leftCtl"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
<div class="ctl right"><div class="btn up" data-k="up" id="upBtn" style="display:none">▲<small>CLIMB</small></div><div class="btn down" data-k="down" id="downBtn" style="display:none">▼<small>DOWN</small></div><div class="btn goat" data-k="butt">🤠<small>LASSO</small></div><div class="btn big" data-k="jump">▲</div></div>
<div id="top"><button id="purseB" aria-label="Mom’s purse">👜<span id="purseN"></span></button><button id="homeB" aria-label="Main menu" style="display:none">🏠</button><button id="pauseB" aria-label="Pause" style="display:none">⏸</button><button id="mute" aria-label="Sound on or off">🔊</button></div>
<div id="pm"><div class="hp"><h1 id="pmH">Paused</h1><button class="go" id="pmGo">▶ Keep playing</button><button class="mid" id="pmRe">↺ Back to last scarecrow</button><button class="home" id="pmHome">🏠 Main menu</button><p id="pmTip">Your progress is saved at the last scarecrow.</p></div></div>
<div id="friend"><div class="fb"><h1>+ ADD A FRIEND</h1><p>First name only. It shows on the leaderboard.</p>
<input id="friendIn" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Their name"><p id="friendErr"></p>
<div class="fr"><button id="friendNo">Cancel</button><button id="friendOk" class="go">Let’s go!</button></div></div></div>
<div id="purse"><div class="hp"><button id="purseX2" aria-label="Close">✕</button><h1>👜 Mom’s Purse</h1><p id="purseSub"></p><div id="purseGrid"></div><button id="purseX">◀ Back</button></div></div>
<div id="rotate">🔄<br>Turn your device sideways<br>to play Holy Cow!</div>
<script>
'use strict';
const VERSION='0.92';
// Testing: add ?unlockall to the address to show "jump to" buttons on the home screen
const TEST=/[?&]unlockall/.test(location.search)||!/github\.io$/.test(location.hostname);
/* =========================================================
   HOLY COW! From the farm to the stars
   Built on the Super Noah engine (physics, controls, audio).
   All art is original pixel art drawn in code.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=960;const H=544,T=32,K=1.5;let ROWS=17,GY=14*T,AY=14*T;
let RES=1,PHONE=false,ZM=1.3,lastFit='';
function fit(){const vv=window.visualViewport,vw=Math.round((vv&&vv.width)||innerWidth||document.documentElement.clientWidth),vh=Math.round((vv&&vv.height)||innerHeight||document.documentElement.clientHeight);
  const key=vw+'x'+vh;if(key===lastFit)return;lastFit=key;
  W=Math.round(Math.min(2000,Math.max(960,H*vw/vh)));const s=Math.min(vw/W,vh/H);PHONE=H*s<520;cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  RES=Math.min(PHONE?1.6:2,Math.max(1,s*(window.devicePixelRatio||1)));const cw=Math.round(W*RES),ch=Math.round(H*RES);if(cv.width!==cw)cv.width=cw;if(cv.height!==ch)cv.height=ch;}
let fitReq=0;function fitSoon(){if(!fitReq)fitReq=requestAnimationFrame(()=>{fitReq=0;fit();});}
addEventListener('resize',fitSoon);if(window.visualViewport)visualViewport.addEventListener('resize',fitSoon);addEventListener('orientationchange',()=>setTimeout(()=>{lastFit='';fit();},300));setInterval(fitSoon,1000);fit();
const zoomBase=()=>PHONE?1.6:1.3;
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('#pm,#friend,#purse')))e.preventDefault();},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

/* ---------------- saving (on this device only) ---------------- */
const KP='philalack_';
// each player on this device gets their own save; only these are shared by everyone
const GLOBALK=new Set(['muted','who','friends','v79']);
let WHO=null;
const skey=k=>GLOBALK.has(k)?KP+k:KP+'u_'+encodeURIComponent((WHO||'_').toLowerCase())+'_'+k;
const store={get(k,d){try{const v=localStorage.getItem(skey(k));return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(skey(k),JSON.stringify(v));}catch(e){}},
             wipe(name){try{const pre=KP+'u_'+encodeURIComponent(name.toLowerCase())+'_';Object.keys(localStorage).filter(k=>k.startsWith(pre)).forEach(k=>localStorage.removeItem(k));}catch(e){}}};
// v0.79 starts everyone fresh: clear the old shared save once
if(!store.get('v79',0)){try{['check','cleared','gold','lastLvl','mode','seen','bestEggs','purse','heroName'].forEach(k=>localStorage.removeItem(KP+k));}catch(e){}store.set('v79',1);}
let FRIENDS=(store.get('friends',[])||[]).filter(n=>typeof n==='string').slice(0,5);
WHO=store.get('who',null);
let MODE=store.get('mode','n');if(!['e','n','h'].includes(MODE))MODE='n';
const EASY=()=>MODE==='e',HARD=()=>MODE==='h',MAXH=()=>HARD()?3:5;

/* ---------------- input ---------------- */
const inp={left:false,right:false,jump:false,butt:false,ok:false,down:false,up:false};const prevInp={};
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'butt',KeyC:'butt',KeyJ:'butt',ShiftLeft:'butt',Enter:'ok',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')e.stopImmediatePropagation();},true);
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')e.stopImmediatePropagation();},true);
addEventListener('keydown',e=>{const k=KEYS[e.code];if(k){if(!inp[k]&&(k==='jump'||k==='ok'))userGo('key');if(!inp[k]){latch[k]=1;if(k==='jump')tapN++;}inp[k]=true;e.preventDefault();}
  if(e.code==='Escape'||e.code==='KeyP'){if(gamePaused)resumeGame();else if(PLAYISH.includes(state))pauseGame('pause');}
  if(e.code==='Backspace'&&state==='story'){storyBack();}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){inp[k]=false;e.preventDefault();}if(e.code==='ArrowUp'||e.code==='KeyW')inp.up=false;});
addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='KeyW')inp.up=true;});
const latch={};let tapN=0;
function pressed(k){return (inp[k]&&!prevInp[k])||!!latch[k];}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const ctlEls=[...document.querySelectorAll('.ctl')];let ctlShown=false;const TOUCHCTL='ontouchstart' in window;
function syncCtl(){const show=isTouch&&state==='play'&&!gamePaused&&!(typeof purseOpen!=='undefined'&&purseOpen);if(show!==ctlShown){ctlShown=show;ctlEls.forEach(el=>el.style.display=show?'flex':'none');
  if(!show){if(window.__lpClear)__lpClear();for(const k in inp)inp[k]=false;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));}}}
{const lc=document.getElementById('leftCtl'),bL=lc.querySelector('[data-k=left]'),bR=lc.querySelector('[data-k=right]'),lp=new Map();
  const upd=()=>{let l=false,r=false;for(const d of lp.values()){if(d==='left')l=true;else r=true;}inp.left=l;inp.right=r;bL.classList.toggle('on',l);bR.classList.toggle('on',r);};
  const dir=x=>{const a=bL.getBoundingClientRect(),b=bR.getBoundingClientRect();return x<(a.right+b.left)/2?'left':'right';};
  lc.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&TOUCHCTL)return;e.preventDefault();try{lc.setPointerCapture(e.pointerId);}catch(_){}lp.set(e.pointerId,dir(e.clientX));upd();});
  lc.addEventListener('pointermove',e=>{if(!lp.has(e.pointerId))return;e.preventDefault();lp.set(e.pointerId,dir(e.clientX));upd();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>lc.addEventListener(ev,e=>{if(lp.delete(e.pointerId))upd();}));
  window.__lpClear=()=>{lp.clear();};}
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;if(k==='left'||k==='right')return;
  const on=e=>{if(e.pointerType==='touch'&&TOUCHCTL)return;e.preventDefault();if(k==='jump'){userGo('key');tapN++;}latch[k]=1;inp[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=e=>{if(e.pointerType==='touch'&&TOUCHCTL)return;e.preventDefault();inp[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());});
let tap=null;
// Touch controls: every finger on screen is checked against the buttons on every touch event.
// This is the most reliable way on iPhone/iPad (Safari, Chrome, Brave all use the same engine there),
// and it stops two-thumb play from being mistaken for a pinch or swipe.
if(TOUCHCTL){const lc=document.getElementById('leftCtl'),bL=lc.querySelector('[data-k=left]'),bR=lc.querySelector('[data-k=right]');
  const others=[...document.querySelectorAll('.btn')].filter(b=>b.dataset.k!=='left'&&b.dataset.k!=='right');
  const inRect=(x,y,r,m)=>x>=r.left-m&&x<=r.right+m&&y>=r.top-m&&y<=r.bottom+m;
  const keyAt=(x,y)=>{const lr=lc.getBoundingClientRect();if(lc.style.display!=='none'&&inRect(x,y,lr,8)){const a=bL.getBoundingClientRect(),b=bR.getBoundingClientRect();return x<(a.right+b.left)/2?'left':'right';}
    let best=null,bd=1e9;for(const b of others){if(!b.offsetParent)continue;const r=b.getBoundingClientRect();if(!inRect(x,y,r,12))continue;const d=Math.hypot(x-(r.left+r.right)/2,y-(r.top+r.bottom)/2);if(d<bd){bd=d;best=b.dataset.k;}}return best;};
  const btnOf=k=>k==='left'?bL:k==='right'?bR:others.find(b=>b.dataset.k===k);
  const handle=e=>{if(!ctlShown)return;if(e.target.closest&&e.target.closest('#top,#pm,#purse,#friend'))return;e.preventDefault();
    const held={};for(const t of e.touches){const k=keyAt(t.clientX,t.clientY);if(k)held[k]=true;}
    for(const k of ['left','right','jump','butt','down','up']){const now=!!held[k];if(now&&!inp[k]){latch[k]=1;if(k==='jump'){tapN++;userGo('key');}}inp[k]=now;const b=btnOf(k);if(b)b.classList.toggle('on',now);}};
  ['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,handle,{passive:false}));
  document.addEventListener('gesturestart',e=>e.preventDefault());}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tap={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};userGo('tap');});
const inR=(p,r)=>p&&r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

/* ---------------- audio (synthesized; with iPhone/iPad unlock) ---------------- */
let actx=null,master=null,noiseBuf=null,muted=!!store.get('muted',false);
const muteBtn=document.getElementById('mute');
function setMute(m){muted=m;store.set('muted',m);muteBtn.textContent=m?'🔇':'🔊';if(master)master.gain.value=m?0:0.55;}
setMute(muted);
muteBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMute(!muted);});
function ensureAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{actx=new AC();}catch(e){return;}
    master=actx.createGain();master.gain.value=muted?0:0.55;master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    try{const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}}
  if(actx.state!=='running'&&!gamePaused&&!document.hidden){try{actx.resume();}catch(e){}}}
function silentWav(){const n=4000,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
let unlocked=false,silentEl=null;
function unlockAudio(){ensureAudio();
  if(!unlocked){unlocked=true;
    // Lets sound play on iPad/iPhone even when the side "silent" switch is on
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}

/* ---------------- physics ---------------- */
function tileAt(tx,ty){if(ty<0||ty>=ROWS)return ' ';if(tx<0||tx>=L.w)return '#';return L.g[ty][tx];}
function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0)return true;if(tx>=L.w)return true;return solidC(L.g[ty][tx]);}
const ghost=(o,tx,ty)=>o.slide&&'XMQRU'.includes(tileAt(tx,ty));
function moveX(o){o.hitW=false;o.x+=o.vx;const y1=Math.floor(o.y/T),y2=Math.floor((o.y+o.h-1)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-1)/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)&&!ghost(o,tx,ty)){o.x=tx*T-o.w;o.vx=0;o.hitW=true;o.hitTile={tx,ty};break;}}
  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)&&!ghost(o,tx,ty)){o.x=(tx+1)*T;o.vx=0;o.hitW=true;o.hitTile={tx,ty};break;}}}
function moveY(o){const pb=o.y+o.h;o.onG=false;o.bump=null;o.spring=null;o.y+=o.vy;const x1=Math.floor(o.x/T),x2=Math.floor((o.x+o.w-1)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/T);for(let tx=x1;tx<=x2;tx++){const c=tileAt(tx,ty);if(ghost(o,tx,ty))continue;if(solidC(c)||((ONEWAY(c)||(c==='L'&&tileAt(tx,ty-1)!=='L'&&!(o===P&&P.climb)))&&pb<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onG=true;if(c==='J'||c==='O')o.spring={tx,ty,fw:c==='O'};break;}}}
  else if(o.vy<0){const ty=Math.floor(o.y/T);let hit=false;for(let tx=x1;tx<=x2;tx++)if(solidAt(tx,ty)&&!ghost(o,tx,ty)){hit=true;break;}
    if(!hit&&o===P){const cx=Math.floor((o.x+o.w/2)/T);if(tileAt(cx,ty)==='I'){L.g[ty][cx]='X';hit=true;}}
    if(hit){o.y=(ty+1)*T;o.vy=0;const cx=Math.floor((o.x+o.w/2)/T);o.bump=solidAt(cx,ty)?{tx:cx,ty}:{tx:x1,ty};}}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

  const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;
  if(e.onG&&!solidC(tileAt(Math.floor((e.x+e.w/2+e.vx*8)/T),Math.floor((e.y+e.h+4)/T))))e.vx=0;}
function drawAlien(e){const cx=e.x+e.w/2,fy=e.y+e.h+1;if(!e.alive){drawSpr(ALIEN.a,14,26,cx,fy-e.dead*2,1,1.2,1.2-e.dead*.03);return;}const air=!e.onG,sq=e.onG&&e.cd<12?1.15:1;
  drawSpr(air?ALIEN.b:ALIEN.a,14,26,cx,fy,e.face||1,1.15*sq,1.15/sq);}
function stepMite(e){if(e.cd==null){e.cd=50+((e.x/T)|0)%4*25;e.face=-1;}e.vy=Math.min(e.vy+.18,5);moveY(e);
  if(e.onG){e.vx*=.6;if(--e.cd<=0){const near=Math.abs(P.x-e.x)<300;e.face=P.x<e.x?-1:1;e.vy=-5.6;e.vx=(near?e.face:(Math.random()<.5?-1:1))*(HARD()?1.9:1.4);e.cd=EASY()?130:95;}}
  const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;if(e.onG&&!solidC(tileAt(Math.floor((e.x+e.w/2+e.vx*8)/T),Math.floor((e.y+e.h+4)/T))))e.vx=0;}
function stepJelly(e){if(e.hx==null){e.hx=e.x;e.hy=e.y;e.k=((e.x/T)|0)*37;}e.k++;const r=EASY()?44:HARD()?84:64,sp=HARD()?.016:.012;
  const nx=e.hx+Math.sin(e.k*sp)*r;e.face=nx>e.x?1:-1;e.x=nx;e.y=e.hy+Math.sin(e.k*.05)*14;}
function stepWalker(e,speed){if(!e.vx)e.vx=-speed;e.vy=Math.min(e.vy+.6,10);moveY(e);const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;
  if(e.onG&&!solidC(tileAt(Math.floor((e.x+e.w/2+Math.sign(e.vx)*(e.w/2+4))/T),Math.floor((e.y+e.h+4)/T))))e.vx=-e.vx;e.face=e.vx>0?1:-1;}
function stepFan(e){if(e.cd==null)e.cd=20+((e.x/T)|0)%5*12;e.vy=Math.min(e.vy+.5,9);moveY(e);e.face=P.x<e.x?-1:1;if(e.cheer>0)e.cheer--;

  const n=Math.min(3,L.eggs);L.eggs-=n;for(let k=0;k<n;k++)L.items.push({t:'egg',x:P.x+P.w/2-10,y:P.y-6,w:20,h:24,vx:away*(1+k*1.2),vy:-6-k,phys:true,age:0});burst(P.x+P.w/2,P.y+10,'#bfe6ff',10);}
function splashBack(){unduck();P.peakY=null;P.climb=false;if(P.ride)endGooseRide(true);sfx('splash');shake=3;
  if(HARD()){if(P.hat){P.hat=false;sfx('hatoff');}else{P.hearts--;sfx('hurt');}if(P.hearts<=0){setState('oneMore');stopSong();return;}}
  if(!P.safe||!standable(P.safe.x,P.safe.y+P.h))P.safe=lastSafeSpot();L.boing={t:0,n:40,x0:P.x,y0:GY-P.h+10,x1:P.safe.x,y1:P.safe.y};P.vx=P.vy=0;}
function standable(x,fy){const r=Math.floor(fy/T);for(const xx of [Math.floor((x+2)/T),Math.floor((x+20)/T)]){const c=tileAt(xx,r);if((solidC(c)||ONEWAY(c))&&c!=='A')return true;}return false;}
function lastSafeSpot(){let best=null;for(const c of L.checks)if(c.on&&(!best||c.x>best.x))best=c;if(best&&standable(best.x,best.y||GY))return {x:best.x,y:(best.y||GY)-P.h};return {x:5*T,y:GY-P.h};}
function fallPit(){if(!P.safe||!standable(P.safe.x,P.safe.y+P.h))P.safe=lastSafeSpot();unduck();P.peakY=null;P.climb=false;if(P.ride)endGooseRide(true);if(P.hat){P.hat=false;sfx('hatoff');}else if(!EASY()){P.hearts--;sfx('hurt');}
  if(P.hearts<=0){setState('oneMore');stopSong();return;}
  P.zone=0;P.x=P.safe.x;P.y=P.safe.y;P.vx=P.vy=0;P.inv=90;G.x=P.x-30;G.y=P.y+P.h-G.h;G.vy=0;burst(P.x+P.w/2,P.y+P.h,'#fff',8);updCam(true);}
function respawn(){if(LV.flight){P.hearts=MAXH();P.inv=120;P.x=L.check.x;flightReset();setState('play');startSong('level');return;}unduck();if(P.ride)endGooseRide(true);P.mount=null;P.hearts=MAXH();P.hat=false;P.inv=120;P.vx=P.vy=0;P.warp=null;P.sink=0;P.zone=0;P.climb=false;P.peakY=null;P.x=L.check.x;P.y=(L.check.y||GY)-P.h;if(!standable(P.x,P.y+P.h)){const sp=lastSafeSpot();P.x=sp.x;P.y=sp.y;}P.safe={x:P.x,y:P.y};
  G.x=P.x-34;G.y=P.y+P.h-G.h;G.mode='walk';L.ents=L.ents.filter(e=>e.t!=='pumpkin'&&e.t!=='bale');
  L.tug=null;jumpGlow(false);if(L.chase==='on'&&LV.boss==='chase')startRaftChase();if(L.chase==='on'){const wf=L.wf;wf.x=LV.wfX*T;wf.st='idle';wf.t=0;wf.face=-1;wf.rot=0;}
  setState('play');startSong();updCam(true);}
function bumpTile({tx,ty}){const c=L.g[ty][tx];
  if(c==='X'||c==='Q'||c==='R'||c==='M'){L.bumpA={tx,ty,t:8};sfx('crate');
    if(c==='M'){const k=tx+','+ty;L.multi[k]=(L.multi[k]||0)+1;addEgg(1);parts.push({kind:'eggpop',x:tx*T+16,y:ty*T-4,vx:0,vy:-4,life:30});
      if(L.multi[k]>=5){L.g[ty][tx]='U';spawnEggFountain(tx*T+16,ty*T,4);popText('JACKPOT!',tx*T+16,ty*T-30,'#ffd23f',true);}else popText((5-L.multi[k])+' more!',tx*T+16,ty*T-24,'#fff');}
    else{L.g[ty][tx]='U';
      if(c==='X'){const hidden=L.hints.some(h=>Math.abs(h.x-(tx*T+16))<4&&Math.abs(h.y-(ty*T+16))<4);
        if(hidden){spawnEggFountain(tx*T+16,ty*T,10);popText('SECRET CRATE!',tx*T+16,ty*T-30,'#ffc94a',true);sfx('secret');confetti(tx*T+16,ty*T,16);L.hints=L.hints.filter(h=>!(Math.abs(h.x-(tx*T+16))<4&&Math.abs(h.y-(ty*T+16))<4));}
        else{addEgg(1);parts.push({kind:'eggpop',x:tx*T+16,y:ty*T-4,vx:0,vy:-4,life:30});}}
      else{const above=solidC(tileAt(tx,ty-1));L.items.push({t:c==='Q'?'hat':'heart',x:tx*T+3,y:above?ty*T+T+2:ty*T-24,w:26,h:22,phys:true,slide:true,age:0,vx:(P.face||1)*1.8,vy:above?0:-5,grav:.35});burst(tx*T+16,ty*T,'#fff6c8',6,'star');}}
    for(const e of L.ents)if(e.alive&&!e.saddle&&e.t!=='fan'&&e.x<tx*T+T&&e.x+e.w>tx*T&&Math.abs(e.y+e.h-ty*T)<6)killEnemy(e);}
  else sfx('bump');}
function killEnemy(e){if(!e.alive)return;e.alive=false;e.dead=0;
  if(e.t==='alien'){sfx('pop');burst(e.x+13,e.y+12,'#7dff8a',12);return;}
  if(e.t==='mite'||e.t==='jelly'||e.t==='blob'||e.t==='bot'){sfx(e.t==='bot'?'crash':'pop');burst(e.x+e.w/2,e.y+e.h/2,{mite:'#b9b6d9',jelly:'#ff9be0',blob:'#9b5cff',bot:'#ffd23f'}[e.t],12);return;}
  if(e.t==='crow'){sfx(e.bat?'pop':'caw');burst(e.x+13,e.y+9,'#3a3646',10);return;}
  if(e.t==='pumpkin'){e.gone=true;sfx('splat');burst(e.x+13,e.y+13,'#f08a24',12);}
  else if(e.t==='fish'){e.gone=true;sfx('splash');burst(e.x+13,e.y+8,'#bfe6ff',10);}
  else if(e.t==='bale'){e.gone=true;sfx('straw');for(let i=0;i<10;i++)parts.push({kind:'straw',x:e.x+15,y:e.y+15,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:45,r:Math.random()*6});}
  else{burst(e.x+e.w/2,e.y+e.h/2,'#ffffff',8,'feather');sfx('honk');}}
function breakHay(tx,ty){const seen=new Set(),st=[[tx,ty]];let n=0;
  while(st.length){const [x,y]=st.pop(),k=x+','+y;if(seen.has(k)||tileAt(x,y)!=='B')continue;seen.add(k);L.g[y][x]=' ';n++;
    for(let i=0;i<4;i++)parts.push({kind:'straw',x:x*T+16,y:y*T+16,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:50,r:Math.random()*6});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  if(n){for(const [x,y,c] of L.reveal)if(L.g[y][x]===' ')L.g[y][x]=c;sfx('straw');shake=6;popText('Something’s behind the hay!',tx*T+16,ty*T-40,'#fff',true);}}
/* ---------- goose ride ---------- */
function startGooseRide(e){unduck();e.gone=true;P.ride={t:EASY()?600:480,flaps:0};P.y-=20;P.h+=20;P.vy=-6;sfx('honk');setTimeout(()=>sfx('yeehaw'),150);

  popText(hit?'Goose bailed!':'Bye, goose!',P.x+P.w/2,P.y-20,'#fff');}

function startWarp(bw,dir){unduck();L.burrowed=L.burrowed||{};if(!bw.exitOnly)L.burrowed[bw.x]=1;dir=dir||1;P.warp={t:0,bw,phase:'dive',dir};P.vx=0;P.vy=0;P.x=(dir>0?bw.x:bw.ex)-P.w/2;P.y=bw.y-P.h;sfx('dig');if(P.ride)endGooseRide(false);}
function stepWarp(){const w=P.warp,bw=w.bw;w.t++;
  if(w.phase==='dive'){P.sink=Math.min(1,w.t/18);if(w.t>=18){w.t=0;if(bw.kind==='tunnel'){w.phase='travel';}else{w.phase='fade';flash=.8;}}}
  else if(w.phase==='travel'){P.sink=1;const sp=3.3,d=w.dir;P.x+=sp*d;P.face=d;if(d>0)L.dug[bw.x]=Math.max(L.dug[bw.x]||0,P.x+P.w/2+30);if(frame%14===0)sfx('dig');
    for(const j of bw.junk)if(!j.said&&Math.abs(P.x+P.w/2-(j.x+16))<16){j.said=1;burst(j.x+16,GY+76,'#fff6c8',8,'star');if(j.kind==='coin')addEgg(5);if(!purse[j.kind])collectJunk(j.kind,j.x+16,GY+76);}
    const end=d>0?bw.ex:bw.x;if((d>0&&P.x+P.w/2>=end)||(d<0&&P.x+P.w/2<=end)){P.x=end-P.w/2;w.phase='rise';w.t=0;sfx('pop');burst(end,GY,'#8a5a2e',14);}}
  else if(w.phase==='fade'){if(w.t>=12){const to=bw.to;P.zone=to.zone;P.x=to.x-P.w/2;P.y=to.y-P.h;w.phase='rise';w.t=0;w.bw={x:to.x,y:to.y};G.x=P.x-36;G.y=to.y-G.h;G.vy=0;updCam(true);
      if(bw.secret){const first=!L.secrets[bw.secret];L.secrets[bw.secret]=1;sfx('secret');confetti(P.x,P.y-20,40);if(first){showBanner(bw.title,bw.sub,'#7dff8a');if(!bw.calm)L.showerAt=frame+80;}else if(!bw.calm)startShower(false);}else sfx('pop');}}
  else if(w.phase==='rise'){P.sink=Math.max(0,1-w.t/18);if(w.t>=18){P.warp=null;P.sink=0;P.vy=-8;P.peakY=null;P.safe={x:P.x,y:P.y};L.lockX=P.x;G.x=P.x-36;G.y=P.y+P.h-G.h;G.vy=0;}}
  updCam();}
function startShower(big){L.shower={t:0,dur:big?600:260,zone:P.zone};if(LV.space)showBanner('GEM SHOWER!','Grab them all!','#ff6fd8');else showBanner('EGG SHOWER!','Grab the shiny ones!','#ffc94a');}
function eggPop(it){const c=RCOL[it.c];sfx('sparkle');parts.push({kind:'ring',x:it.x+10,y:it.y+12,c,life:18,vx:0,vy:0});for(let i=0;i<10;i++){const a=i/10*Math.PI*2;parts.push({kind:'star',x:it.x+10,y:it.y+12,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,life:24,c:i%2?c:'#ffffff'});}}
let purse=store.get('purse',{})||{};
function purseCount(){return PURSE_ITEMS.filter(i=>purse[i.k]).length;}
function updPurseBadge(){const n=purseCount();document.getElementById('purseN').textContent=n?n:'';}
function collectJunk(k,wx,wy){purse[k]=1;store.set('purse',purse);sfx('secret');updPurseBadge();
  const sx=(wx-cam.x)*ZM,sy=(wy-cam.y)*ZM;parts.push({kind:'tojunk',k,screen:true,x:sx,y:sy,x0:sx,y0:sy,life:60,vx:0,vy:0});
  const b=document.getElementById('purseB');b.classList.remove('wiggle');void b.offsetWidth;setTimeout(()=>b.classList.add('wiggle'),900);}
function useDoor(d){unduck();P.peakY=null;sfx('door');flash=.8;const to=d.to;P.zone=to.zone;P.x=to.x-P.w/2;P.y=to.y-P.h;P.vx=0;P.vy=0;G.x=P.x-36;G.y=to.y-G.h;G.vy=0;L.doorLock=40;L.lockX=P.x;updCam(true);
  if(d.secret){const first=!L.secrets[d.secret];L.secrets[d.secret]=1;sfx('secret');confetti(P.x,P.y-20,40);if(first){showBanner(d.title,d.sub,'#ffc94a');if(!d.calm)L.showerAt=frame+80;}else if(!d.calm)startShower(false);}}

function groundUnder(px,footY){const tx=Math.floor(px/T),ty=Math.floor((footY+4)/T);for(let y=ty;y<Math.min(ROWS,ty+3);y++){const c=tileAt(tx,y);if(solidC(c)||ONEWAY(c))return true;}return false;}
// Buttons aims at the closest threat on either side; if nothing is near, he charges the way you face
function goatAim(){const gx=P.x+P.w/2,gy=P.y+P.h;let best=null,bd=300;const cand=[];
  for(const e of L.ents)if(e.alive&&!e.saddle)cand.push([e.x+e.w/2,e.y+e.h]);
  if(L.chase==='on'&&!L.wf.hidden&&!P.mount)cand.push([L.wf.x+L.wf.w/2,L.wf.y+L.wf.h]);
  if(P.zone===0)for(const h of L.hints)if(looseHay(h))cand.push([(h.need.x+1)*T,(h.need.y+1)*T]);
  for(const [x,y] of cand){const d=Math.abs(x-gx);if(d<bd&&Math.abs(y-gy)<100){bd=d;best=x;}}
  return best==null?P.face:(best<gx?-1:1);}
function landLogs(o,pf0){o.onLog=null;if(o.onG||o.vy<0||!L.logs.length)return;for(const lg of L.logs)if(o.x+o.w>lg.x+4&&o.x<lg.x+lg.w-4&&pf0<=lg.y+3&&o.y+o.h>=lg.y){o.y=lg.y-o.h;o.vy=0;o.onG=true;o.onLog=lg;return;}}
function stepGoat(){G.x=-999;G.y=0;G.leap=null;G.mode='walk';if(LV&&LV.jetpack)return;
  if(pressed('butt')&&LV.boss==='lasso'&&L.chase==='on'&&tryLasso())return;
  if(pressed('butt')&&!L.rope&&!P.mount&&!P.warp&&!L.tug&&!P.swing)throwRope();
  stepRope();}
// toss the lasso toward the nearest thing worth roping (or straight ahead)
function lassoAim(){const gx=P.x+P.w/2,gy=P.y+P.h/2;let best=null,bd=230;
  const look=(x,y)=>{const d=Math.abs(x-gx);if(d<bd&&Math.abs(y-gy)<70){bd=d;best=x;}};
  for(const e of L.ents)if(e.alive&&!e.saddle&&e.t!=='fan'&&!(e.tied>0)&&!(e.t==='fish'&&e.hide))look(e.x+e.w/2,e.y+e.h/2);
  if(L.chase==='on'&&!L.wf.hidden&&!P.mount)look(L.wf.x+L.wf.w/2,L.wf.y+L.wf.h/2);
  for(let dx=-7;dx<=7;dx++)for(let dy=-2;dy<=1;dy++){const tx=Math.floor(gx/T)+dx,ty=Math.floor(gy/T)+dy;if(tileAt(tx,ty)==='B')look(tx*T+16,ty*T+16);}
  return best==null?P.face:(best<gx?-1:1);}
function throwRope(){const f=lassoAim();P.face=f;L.rope={face:f,dist:10,max:6.5*T,back:false,t:0};sfx('whoosh');}
function ropeTip(){const r=L.rope;return {x:P.x+P.w/2+r.face*(r.dist+8),y:P.y+Math.min(P.h*.35,18)};}
function stepRope(){const r=L.rope;if(!r)return;r.t++;
  if(r.back){r.dist-=24;if(r.dist<=0)L.rope=null;return;}
  r.dist+=16;const tip=ropeTip(),tx=Math.floor(tip.x/T),ty=Math.floor(tip.y/T),c=tileAt(tx,ty);
  const done=(col)=>{r.back=true;burst(tip.x,tip.y,col||'#fff',6,'star');};
  // hay bales and alien crates get yanked out of the way
  for(const dy of [0,1]){if(tileAt(tx,ty+dy)==='B'){breakHay(tx,ty+dy);sfx('bonk');shake=4;done('#ffd23f');return;}}
  if(solidC(c)){sfx('bump');done();return;}
  // Henry: a lasso toss makes him dizzy
  if(L.chase==='on'&&!L.wf.hidden&&!P.mount&&LV.boss!=='chase'){const wf=L.wf;if(tip.x>wf.x-6&&tip.x<wf.x+wf.w+6&&tip.y>wf.y-10&&tip.y<wf.y+wf.h+10&&wf.st!=='dizzy'&&wf.st!=='ridden'){
    wf.st='dizzy';wf.t=0;sfx('bonk');shake=6;done('#ffd23f');return;}}
  // critters get tied up for a few seconds
  for(const e of L.ents){if(!e.alive||e.saddle||e.t==='fan'||e.t==='snap'||(e.t==='fish'&&e.hide)||e.tied>0)continue;
    if(tip.x>e.x-8&&tip.x<e.x+e.w+8&&tip.y>e.y-12&&tip.y<e.y+e.h+12){e.tied=EASY()?260:HARD()?150:200;e.vx=0;e.vy=0;sfx('boing');done('#ffd23f');return;}}
  if(r.dist>=r.max)r.back=true;}
function drawLassoRope(){const r=L.rope;if(!r||P.zone<0)return;const hx=P.x+P.w/2+r.face*6,hy=P.y+Math.min(P.h*.35,18),tip=ropeTip();
  ctx.strokeStyle='#c8873e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx,hy);const mx=(hx+tip.x)/2,sag=r.back?10:4+Math.sin(r.t*.6)*3;ctx.quadraticCurveTo(mx,hy+sag,tip.x,tip.y);ctx.stroke();
  ctx.strokeStyle='#8a5a2e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx,hy+1);ctx.quadraticCurveTo(mx,hy+sag+1,tip.x,tip.y+1);ctx.stroke();
  ctx.strokeStyle='#e0a95e';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(tip.x+r.face*8,tip.y,10,7,frame*.4%6.28,0,7);ctx.stroke();}
function drawTied(e){const cx=e.x+e.w/2,cy=e.y+e.h/2,blink=e.tied<50&&frame%10<5;if(blink)return;ctx.strokeStyle='#c8873e';ctx.lineWidth=3;
  for(const k of [-.25,.1,.4]){ctx.beginPath();ctx.ellipse(cx,cy+k*e.h,e.w*.62,5,0,0,7);ctx.stroke();}
  for(let i=0;i<3;i++){const a=frame*.15+i*2.1;txt('★',cx+Math.cos(a)*16,e.y-6+Math.sin(a)*4,10,'#ffd23f');}}

const ladAt=(px,py)=>tileAt(Math.floor(px/T),Math.floor(py/T))==='L';
// ladders: hold UP to climb, DOWN to climb down, JUMP to hop off
function climbCheck(){const cx=P.x+P.w/2,body=ladAt(cx,P.y+P.h-3)||ladAt(cx,P.y+P.h*.5),top=P.onG&&!body&&ladAt(cx,P.y+P.h+4);
  L.ladUp=body&&!P.climb;L.ladDown=top;
  if(!P.climb){if((body&&inp.up)||(top&&pressed('down'))){if(P.ride)endGooseRide(false);P.climb=true;P.x=Math.floor(cx/T)*T+16-P.w/2;P.vx=0;P.vy=0;P.buf=0;P.jumping=false;if(top)P.y+=8;
      if(!L.hinted.ladder){L.hinted.ladder=1;popText(isTouch?'Hold ⬆ to climb!':'Hold UP to climb!',cx,P.y-30,'#ffe9b8',true);}}else return false;}
  L.ladUp=false;P.vx=0;P.vy=0;P.onG=false;P.coy=0;
  const nearTop=()=>{const tx=Math.floor(cx/T);let ty=Math.floor((P.y+P.h-2)/T);while(ty>0&&tileAt(tx,ty-1)==='L')ty--;return P.y+P.h-ty*T<=36&&tileAt(tx,ty)==='L'?ty:null;};
  if(pressed('jump')&&!inp.up){const tt=nearTop();P.climb=false;if(tt!=null)P.y=tt*T-P.h;P.vy=-14;P.jumping=false;P.peakY=null;P.vx=(inp.left?-1:inp.right?1:P.face)*3;sfx('jump');return true;}
  if(pressed('left')||pressed('right')){const tt=nearTop();P.climb=false;P.face=inp.left?-1:1;if(tt!=null){P.y=tt*T-P.h;P.onG=true;}P.vx=P.face*3;return true;}
  let v=(inp.up?-3.4:0)+(inp.down?3.4:0);if(!v&&nearTop()!=null)v=-3.4;P.y+=v;if(v){P.anim+=.2;if(frame%14===0)sfx('talk');}
  const ft=P.y+P.h,tx=Math.floor(P.x+P.w/2)/T|0;
  if(v<0&&!ladAt(cx,ft-1)){P.y=(Math.floor((ft-1)/T)+1)*T-P.h;P.climb=false;P.onG=true;P.landT=0;P.buf=0;P.noJump=true;}
  else if(v>0&&solidC(tileAt(tx,Math.floor(ft/T)))){P.y=Math.floor(ft/T)*T-P.h;P.climb=false;P.onG=true;}
  else if(v>0&&!ladAt(cx,ft-2)&&!ladAt(cx,P.y+P.h*.5))P.climb=false;
  P.peakY=P.y;return true;}
function rideLowNeeded(){const full=P.h+P.crouch,top=P.y+P.h-full-6,bot=P.y+P.h-full+Math.round((full-20)*.5)+2;
  for(let x=Math.floor((P.x-34)/T);x<=Math.floor((P.x+P.w+34)/T);x++)for(let y=Math.floor(top/T);y<=Math.floor(bot/T);y++){if(y>=0&&solidC(tileAt(x,y)))return true;}return false;}

function stepChute(){const e=L.esc,wf=L.wf,C=LV.chute;e.t++;
  P.vx*=.7;P.vy=Math.min(P.vy+.8,13);moveX(P);moveY(P);
  const smash=(col,y1,y2,yy)=>{for(let y=y1;y<y2;y++)L.g[y][col]=' ';sfx('crash');shake=12;for(let i=0;i<12;i++)parts.push({kind:'splinter',x:col*T+16,y:yy-20-Math.random()*90,vx:2+Math.random()*4,vy:-3-Math.random()*4,life:60});};
  if(e.t===12){popText('Moo?',wf.x+wf.w/2,wf.y-30,'#fff');sfx('moo');}
  if(!e.ph)e.ph='run';
  if(e.ph==='run'){if(e.t>40){wf.st='walk';wf.face=1;wf.y=AY-wf.h;wf.x+=5;
    if(!e.wall&&wf.x+wf.w>C.wall*T){e.wall=1;smash(C.wall,AY/T-10,AY/T,AY);popText('MOOOOO!',C.wall*T,AY-140,'#fff',true);}
    if(wf.x+wf.w/2>=(C.x+1.5)*T){wf.x=(C.x+1.5)*T-wf.w/2;e.ph='fall';wf.vy=0;L.camFollow={x:0,y:0};sfx('whoosh');popText('WHEEEE!',wf.x+wf.w/2,wf.y-30,'#ffd23f',true);}}}
  else if(e.ph==='fall'){wf.vy=Math.min(wf.vy+.4,14);wf.y+=wf.vy;wf.rot+=.12;if(frame%3===0)parts.push({kind:'straw',x:wf.x+wf.w/2+(Math.random()-.5)*60,y:wf.y,vx:(Math.random()-.5)*3,vy:-2,life:40,r:Math.random()*6});
    if(frame%40===0)sfx('whoosh');if(wf.y+wf.h>=GY){wf.y=GY-wf.h;wf.rot=0;e.ph='out';shake=8;sfx('bonk');burst(wf.x+wf.w/2,GY,'#e8c45a',16);}}
  else if(e.ph==='out'){wf.x+=6;wf.face=1;if(!e.door&&wf.x+wf.w>C.doors*T){e.door=1;smash(C.doors,GY/T-6,GY/T,GY);popText('MOOOOO!',C.doors*T,GY-140,'#fff',true);}

function stepEscape(){if(LV.escape==='chute'){stepChute();return;}if(LV.escape==='corn'){stepCornEscape();return;}const e=L.esc,wf=L.wf,pk=L.giant;e.t++;

  else{if(LV.escape==='bale'){wf.onBale=true;wf.hop=0;}else wf.hidden=true;pk.vx=Math.min(pk.vx+.15,7);pk.x+=pk.vx;pk.rot+=pk.vx/pk.r;

function updCam(snap){const chase=!!L.chase&&P.zone===0;const zt=chase?1:zoomBase();ZM=snap?zt:ZM+(zt-ZM)*.06;if(Math.abs(ZM-zt)<.002)ZM=zt;const VW=W/ZM,VH=H/ZM;
  const z=ZONES[P.zone],zw=z.x1-z.x0,zy0=z.y0||0,zy1=z.y1||ROWS*T,fo=L.camFollow;
  const lt=!LV.vertical?0:P.climb?(inp.up?-90:inp.down?80:0):!P.onG?(P.vy<-3?-60:P.vy>5?90:0):0;L.lean=(L.lean||0)+(lt-(L.lean||0))*.05;
  let ct=fo?fo.x-VW/2:P.x+P.w/2-VW*.4+P.face*Math.min(50,Math.abs(P.vx)*8);if(chase&&!fo)ct=LV.boss==='chase'&&L.chase==='on'?L.scrollX:ARR+T-VW;
  ct=zw<=VW?z.x0-(VW-zw)/2:Math.max(z.x0,Math.min(z.x1-VW,ct));cam.x=snap||(LV.boss==='chase'&&L.chase==='on'&&!fo&&P.zone===0)?ct:cam.x+(ct-cam.x)*(fo?.2:.12);
  if(P.onG||P.climb||P.mount||L.camGround==null)L.camGround=P.y+P.h;let ty=fo?fo.y:P.warp&&P.warp.phase==='travel'?GY+60:P.y+P.h/2+L.lean;
  if(!fo&&!P.warp&&!P.climb){const up=L.camGround-(P.y+P.h);if(up>0&&up<VH*.4)ty=L.camGround-P.h/2+L.lean;}let cy=chase&&!fo?AY+2*T-VH:ty-VH*(fo?.5:.58);cy=zy1-zy0<=VH?zy0:Math.max(zy0,Math.min(zy1-VH,cy));cam.y=snap?cy:cam.y+(cy-cam.y)*(fo?.3:.12);}

function speaker(w){if(w==='Hero')return hero().name;if(w==='Other')return hero().name==='Dad'?'Mom':'Dad';if(w==='Mom'&&hero().name==='Mom')return 'Dad';return w;}
function runStory(lines,done,id,top){if(!lines||!lines.length){done();return;}const seen=store.get('seen',{})||{};story={lines:lines.map(l=>({who:speaker(l.who),scene:l.scene||'level',text:l.text})),i:0,ch:0,done,id,skip:true,top:!!top};setState('story');}
function endStory(){const d=story.done,id=story.id;if(id){const s=store.get('seen',{})||{};s[id]=1;store.set('seen',s);}story=null;d();}
function advanceStory(){const ln=story.lines[story.i];if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
  story.i++;story.ch=0;stateT=0;if(story.i>=story.lines.length)endStory();}
function storyBack(){if(state!=='story'||!story||story.i===0)return;story.i--;story.ch=story.lines[story.i].text.length;stateT=30;sfx('bump');}
function stepStory(){const ln=story.lines[story.i];if(story.ch<ln.text.length){const b=Math.floor(story.ch/3);story.ch+=1.4;if(Math.floor(story.ch/3)!==b)sfx('talk');}}
let DLG={next:null,back:null,skip:null};
function userGo(src){
  if(state==='story'&&story&&stateT>6){const ln=story.lines[story.i];
    if(src==='tap'&&story.skip&&inR(tap,DLG.skip)){sfx('whoosh');endStory();return;}
    if(src==='tap'&&inR(tap,DLG.back)){storyBack();return;}
    if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
    if(src==='tap'&&!inR(tap,DLG.next)&&stateT<25)return;
    advanceStory();}}

/* ---------------- step ---------------- */
function step(){frame++;stateT++;tickSong();
  if(L&&L.esc&&state!=='escape'&&L.giant.crashed&&L.giant.x<L.w*T+400){const pk=L.giant;pk.x+=pk.vx;pk.rot+=pk.vx/pk.r;}
  if(banner&&++banner.t>130)banner=null;if(flash>0)flash=Math.max(0,flash-.05);
  switch(state){
    case 'title':stepTitle();break;
    case 'story':stepStory();if(L&&L.chase==='intro'&&story&&story.lines[story.i].scene==='level')updCam();break;
    case 'card':if(tap&&inR(tap,BACKR())){goTitle();break;}if(stateT>30&&(pressed('jump')||pressed('ok')||tap))setState('play');else if(stateT>300)setState('play');break;
    case 'play':stepPlay();break;
    case 'escape':stepEscape();break;
    case 'oneMore':if(stateT>40){const b=endButtons();if(tap&&inR(tap,b[1]))goTitle();else if(pressed('jump')||pressed('ok')||(tap&&inR(tap,b[0])))respawn();}break;
    case 'clear':if(stateT>50){const b=clearButtons();if(tap&&inR(tap,b[1]))goMap();else if(pressed('ok')||(tap&&inR(tap,b[0])))playWorld(lvlIdx+1<LEVELS.length?lvlIdx+1:lvlIdx);}break;
    case 'map':stepMap();break;case 'board':stepBoard();break;case 'who':stepWho();break;}
  syncCtl();
  for(const k in inp)prevInp[k]=inp[k];for(const k in latch)delete latch[k];tapN=0;tap=null;
  for(const p of parts){p.x+=p.vx||0;p.y+=p.vy||0;const gk={dot:.22,straw:.25,splinter:.22,hat:.22,eggpop:.22,conf:.18,feather:.06,flygoose:-.08}[p.kind];if(gk)p.vy+=gk;if(p.kind==='conf'||p.kind==='straw')p.vx*=.98;p.life--;}
  parts=parts.filter(p=>p.life>0);if(shake>0)shake-=.5;}

function stepTitle(){startSong('menu');if(!WHO){openWho();return;}if(!tap)return;if(inR(tap,TROPHYR())){openBoard();return;}

  for(const r of cardRects())if(inR(tap,r)){heroName=FAM[r.i].name;store.set('heroName',heroName);sfx('egg');return;}

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){if(!gamePaused)step();acc-=1000/60;}render();updTop();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
