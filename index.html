<html lang="en">

<style>
html,body{margin:0;height:100%;background:#1e140f;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

canvas{display:block;background:#4fb3ff;touch-action:none}

.ctl.right{right:max(18px,env(safe-area-inset-right))}

#top button{position:relative}#purseN{position:absolute;top:-6px;right:-6px;background:#ff4f7a;color:#fff;font:800 12px system-ui;border-radius:10px;padding:1px 6px;border:2px solid #fff}#purseN:empty{display:none}
#purseB.wiggle{animation:wig .25s 4 alternate}@keyframes wig{from{transform:rotate(-14deg) scale(1.15)}to{transform:rotate(14deg) scale(1.15)}}

#purse h1{margin:0;font-size:30px;color:#c2185b}#purse p{margin:0;font:700 16px system-ui;color:#5a4a3e;text-align:center}

.pi{background:#fff;border:3px solid #e9c1d6;border-radius:16px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.pi img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;flex:none}.pi b{display:block;font-size:15px;color:#2a1a12}.pi small{display:block;font:600 12px system-ui;color:#6a5d52;line-height:1.3}
.pi.no{opacity:.6;border-style:dashed}.pi.no img{filter:brightness(0) opacity(.35)}
#purse button{font:800 20px ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;color:#fff;border:3px solid #fff;border-radius:30px;padding:12px 20px;width:100%;max-width:290px;box-shadow:0 4px 0 rgba(0,0,0,.3);min-height:50px;background:#5fb648}
#rotate{position:fixed;inset:0;background:#1e140f;color:#fff8ea;display:none;align-items:center;justify-content:center;text-align:center;font:bold 26px system-ui,sans-serif;z-index:10;padding:24px;line-height:1.4}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (max-height:500px){
  .btn{width:80px;height:80px;font-size:28px;border-width:2.5px;background:rgba(30,20,15,.28);box-shadow:none}
  .btn.big{width:94px;height:94px;font-size:34px}
  .btn.goat,.btn.down{width:76px;height:76px;font-size:24px}
  .btn small{font-size:9px}
  .ctl{gap:12px;bottom:max(8px,env(safe-area-inset-bottom))}
  .ctl.left{left:max(10px,env(safe-area-inset-left))}
  .ctl.right{right:max(10px,env(safe-area-inset-right))}
  #top button{font-size:16px;padding:3px 7px;min-width:40px;min-height:38px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="ctl left" id="leftCtl"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
<div class="ctl right"><div class="btn down" data-k="down" id="downBtn" style="display:none">⬇<small>HOP IN</small></div><div class="btn goat" data-k="butt">🐐<small>HEADBUTT</small></div><div class="btn big" data-k="jump">⬆</div></div>
<div id="top"><button id="purseB" aria-label="Mom’s purse">👜<span id="purseN"></span></button><button id="homeB" aria-label="Main menu" style="display:none">🏠</button><button id="pauseB" aria-label="Pause" style="display:none">⏸</button><button id="mute" aria-label="Sound on or off">🔊</button></div>
<div id="pm"><div class="hp"><h1 id="pmH">Paused</h1><button class="go" id="pmGo">▶ Keep playing</button><button class="mid" id="pmRe">↺ Back to last scarecrow</button><button class="home" id="pmHome">🏠 Main menu</button><p id="pmTip">Your progress is saved at the last scarecrow.</p></div></div>
<div id="purse"><div class="hp"><h1>👜 Mom’s Purse</h1><p id="purseSub"></p><div id="purseGrid"></div><button id="purseX">◀ Back</button></div></div>
<div id="rotate">🔄<br>Turn your device sideways<br>to play Philalack Farms!</div>
<script>
'use strict';
const VERSION='0.10';
/* =========================================================
   PHILALACK FARMS: Catch Waffles!
   Built on the Super Noah engine (physics, controls, audio).
   All art is original pixel art drawn in code.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=960;const H=544,T=32,ROWS=17,GY=14*T,K=1.5;
let RES=1,PHONE=false,ZM=1.3,lastFit='';
function fit(){const vw=Math.round(document.documentElement.clientWidth||innerWidth),vh=Math.round(innerHeight||document.documentElement.clientHeight);
  const key=vw+'x'+vh;if(key===lastFit)return;lastFit=key;
  W=Math.round(Math.min(1600,Math.max(960,H*vw/vh)));const s=Math.min(vw/W,vh/H);PHONE=H*s<520;cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  RES=Math.min(2.5,Math.max(1,s*(window.devicePixelRatio||1)));const cw=Math.round(W*RES),ch=Math.round(H*RES);if(cv.width!==cw)cv.width=cw;if(cv.height!==ch)cv.height=ch;}
let fitReq=0;function fitSoon(){if(!fitReq)fitReq=requestAnimationFrame(()=>{fitReq=0;fit();});}
addEventListener('resize',fitSoon);addEventListener('orientationchange',()=>setTimeout(()=>{lastFit='';fit();},300));setInterval(fitSoon,1000);fit();
const zoomBase=()=>PHONE?1.6:1.3;
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('#pm')))e.preventDefault();},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

/* ---------------- saving (on this device only) ---------------- */
const KP='philalack_';
const store={get(k,d){try{const v=localStorage.getItem(KP+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v));}catch(e){}}};
let MODE=store.get('mode','n');if(!['e','n','h'].includes(MODE))MODE='n';
const EASY=()=>MODE==='e',HARD=()=>MODE==='h',MAXH=()=>HARD()?3:5;

/* ---------------- input ---------------- */
const inp={left:false,right:false,jump:false,butt:false,ok:false,down:false};const prevInp={};
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'butt',KeyC:'butt',KeyJ:'butt',ShiftLeft:'butt',Enter:'ok',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(k){if(!inp[k]&&(k==='jump'||k==='ok'))userGo('key');inp[k]=true;e.preventDefault();}
  if(e.code==='Escape'||e.code==='KeyP'){if(gamePaused)resumeGame();else if(PLAYISH.includes(state))pauseGame('pause');}
  if(e.code==='Backspace'&&state==='story'){storyBack();}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){inp[k]=false;e.preventDefault();}});
function pressed(k){return inp[k]&&!prevInp[k];}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const ctlEls=[...document.querySelectorAll('.ctl')];let ctlShown=false;
function syncCtl(){const show=isTouch&&state==='play'&&!gamePaused&&!(typeof purseOpen!=='undefined'&&purseOpen);if(show!==ctlShown){ctlShown=show;ctlEls.forEach(el=>el.style.display=show?'flex':'none');
  if(!show){if(window.__lpClear)__lpClear();for(const k in inp)inp[k]=false;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));}}}
{const lc=document.getElementById('leftCtl'),bL=lc.querySelector('[data-k=left]'),bR=lc.querySelector('[data-k=right]'),lp=new Map();
  const upd=()=>{let l=false,r=false;for(const d of lp.values()){if(d==='left')l=true;else r=true;}inp.left=l;inp.right=r;bL.classList.toggle('on',l);bR.classList.toggle('on',r);};
  const dir=x=>{const a=bL.getBoundingClientRect(),b=bR.getBoundingClientRect();return x<(a.right+b.left)/2?'left':'right';};
  lc.addEventListener('pointerdown',e=>{e.preventDefault();try{lc.setPointerCapture(e.pointerId);}catch(_){}lp.set(e.pointerId,dir(e.clientX));upd();});
  lc.addEventListener('pointermove',e=>{if(!lp.has(e.pointerId))return;e.preventDefault();lp.set(e.pointerId,dir(e.clientX));upd();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>lc.addEventListener(ev,e=>{if(lp.delete(e.pointerId))upd();}));
  window.__lpClear=()=>{lp.clear();};}
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;if(k==='left'||k==='right')return;
  const on=e=>{e.preventDefault();if(k==='jump')userGo('key');inp[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=e=>{e.preventDefault();inp[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());});
let tap=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tap={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};userGo('tap');});
const inR=(p,r)=>p&&r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

/* ---------------- audio (synthesized; with iPhone/iPad unlock) ---------------- */
let actx=null,master=null,noiseBuf=null,muted=!!store.get('muted',false);
const muteBtn=document.getElementById('mute');
function setMute(m){muted=m;store.set('muted',m);muteBtn.textContent=m?'🔇':'🔊';if(master)master.gain.value=m?0:0.55;}
setMute(muted);
muteBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMute(!muted);});
function ensureAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{actx=new AC();}catch(e){return;}
    master=actx.createGain();master.gain.value=muted?0:0.55;master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    try{const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}}
  if(actx.state!=='running'&&!gamePaused&&!document.hidden){try{actx.resume();}catch(e){}}}
function silentWav(){const n=4000,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
let unlocked=false,silentEl=null;
function unlockAudio(){ensureAudio();
  if(!unlocked){unlocked=true;
    // Lets sound play on iPad/iPhone even when the side "silent" switch is on
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    try{silentEl=document.createElement('audio');silentEl.src=silentWav();silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.play().catch(()=>{});}catch(e){}}}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true,passive:true}));
// iPhone/iPad: closing the tab or switching apps doesn't always send 'hidden', so stop all sound on these too
function soundStopNow(){try{if(actx&&actx.state==='running')actx.suspend();}catch(e){}try{if(silentEl)silentEl.pause();}catch(e){}}
addEventListener('pagehide',soundStopNow);addEventListener('freeze',soundStopNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden){soundStopNow();if(PLAYISH.includes(state))pauseGame('pause');}});
addEventListener('pageshow',()=>{try{if(silentEl&&unlocked)silentEl.play().catch(()=>{});}catch(e){}});
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function hz(n){const m=n.match(/^([A-G]#?)(\d)$/);const midi=NOTE[m[1]]+(+m[2]+1)*12;return 440*Math.pow(2,(midi-69)/12);}
function toneAt(f,at,dur,type,vol,slide){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),at+dur);
  g.gain.setValueAtTime(vol||0.12,at);g.gain.exponentialRampToValueAtTime(0.001,at+dur);o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+0.03);}
function noise(at,dur,vol,freq,type){if(!actx||!noiseBuf)return;const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();
  f.type=type||'lowpass';f.frequency.value=freq||1000;const g=actx.createGain();g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.001,at+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(at);s.stop(at+dur+0.05);}
const now=()=>actx?actx.currentTime:0;
let comboPitch=0;
const SFX={
  jump(){toneAt(330,now(),.13,'square',.08,820);},
  land(){noise(now(),.05,.12,500);},
  egg(){const k=Math.pow(2,Math.min(14,comboPitch)/12);toneAt(1047*k,now(),.05,'triangle',.17);toneAt(1568*k,now()+.045,.09,'triangle',.15);},
  gold(){[784,988,1175,1568,1976,2349].forEach((f,i)=>toneAt(f,now()+i*.06,.16,'triangle',.18));noise(now()+.3,.4,.08,6000,'highpass');},
  secret(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>toneAt(f,now()+i*.07,.2,'square',.08));},
  combo(){[880,1175,1568].forEach((f,i)=>toneAt(f,now()+i*.05,.1,'square',.07));},
  bump(){toneAt(170,now(),.09,'square',.12);},
  crate(){noise(now(),.08,.25,1800,'bandpass');toneAt(260,now(),.18,'triangle',.18,700);},
  hat(){[392,523,659,784,1047].forEach((f,i)=>toneAt(f,now()+i*.06,.13,'square',.08));},
  hatoff(){[784,622,523,392].forEach((f,i)=>toneAt(f,now()+i*.06,.12,'square',.08));},
  heart(){[660,880,1100].forEach((f,i)=>toneAt(f,now()+i*.07,.12,'triangle',.2));},
  stomp(){toneAt(520,now(),.13,'square',.12,110);noise(now(),.06,.15,2500);},
  honk(){toneAt(330,now(),.12,'sawtooth',.07,300);toneAt(300,now()+.13,.14,'sawtooth',.07,260);},
  flap(){noise(now(),.12,.2,900,'bandpass');toneAt(500,now(),.08,'triangle',.06,700);},
  hurt(){toneAt(420,now(),.35,'sawtooth',.1,90);},
  butt(){noise(now(),.12,.3,700);toneAt(150,now(),.12,'square',.12,70);toneAt(520,now()+.08,.22,'sawtooth',.05,470);},
  bonk(){toneAt(200,now(),.14,'square',.14,80);noise(now(),.08,.3,1200);},
  straw(){noise(now(),.35,.35,2400,'bandpass');toneAt(300,now(),.2,'triangle',.12,900);},
  moo(){toneAt(150,now(),.7,'sawtooth',.11,105);toneAt(152,now(),.7,'triangle',.12,108);},
  yeehaw(){toneAt(520,now(),.25,'square',.08,880);toneAt(880,now()+.22,.3,'square',.08,620);},
  check(){[523,659,784,1047].forEach((f,i)=>toneAt(f,now()+i*.08,.13,'square',.09));},
  fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>toneAt(f,now()+i*.13,.2,'square',.1));},
  dig(){for(let i=0;i<4;i++)noise(now()+i*.09,.07,.25,600);},
  pop(){toneAt(300,now(),.18,'square',.12,900);},
  door(){toneAt(220,now(),.1,'square',.1);toneAt(330,now()+.1,.15,'square',.1);},
  boing(){toneAt(220,now(),.25,'sine',.25,640);},
  splat(){noise(now(),.2,.35,500);toneAt(140,now(),.15,'sine',.2,60);},
  crash(){noise(now(),.6,.55,900);toneAt(110,now(),.4,'square',.14,40);},
  whoosh(){noise(now(),.3,.2,1800,'bandpass');},
  sparkle(){const k=Math.pow(2,Math.min(14,comboPitch)/12);toneAt(1568*k,now(),.08,'triangle',.14);toneAt(2349*k,now()+.04,.12,'sine',.1);noise(now(),.08,.06,7000,'highpass');},
  twinkle(){const n=[1047,1175,1319,1568,1760,2093];toneAt(n[Math.floor(Math.random()*6)],now(),.18,'sine',.05);},
  talk(){toneAt(560+Math.random()*260,now(),.035,'square',.03);}
};
function sfx(n){if(actx&&!muted&&!gamePaused)SFX[n]();}
const SONG={step:60/138/2,
  lead:'G4 - B4 D5 - B4 G4 - A4 - C5 E5 - C5 A4 - B4 - D5 G5 - D5 B4 - A4 G4 F#4 A4 G4 - - - E5 - D5 B4 - G4 B4 - C5 - B4 A4 - E4 F#4 - G4 - B4 D5 - G5 F#5 - E5 D5 C5 A4 G4 - - -'.split(' '),
  bass:'G2 - D3 - G2 - D3 - A2 - E3 - A2 - E3 - G2 - D3 - G2 - D3 - D3 - A2 - G2 - - - C3 - G3 - C3 - G3 - A2 - E3 - D3 - A2 - G2 - D3 - E3 - B2 - C3 - D3 - G2 - - -'.split(' ')};
let songOn=false,songI=0,songT=0;
function startSong(){if(songOn)return;songOn=true;songI=0;songT=actx?actx.currentTime+.08:0;}
function stopSong(){songOn=false;}
function tickSong(){if(!songOn||!actx||muted||actx.state!=='running')return;if(songT<actx.currentTime)songT=actx.currentTime+.05;
  while(songT<actx.currentTime+.25){const i=songI%SONG.lead.length,l=SONG.lead[i],b=SONG.bass[i];
    if(l&&l!=='-'){toneAt(hz(l),songT,.2,'square',.03);toneAt(hz(l)*2,songT,.08,'triangle',.018);}
    if(b&&b!=='-')toneAt(hz(b),songT,.3,'triangle',.1);
    if(i%4===2)noise(songT,.04,.05,6000,'highpass');
    songI++;songT+=SONG.step;}}

  if(L.chase==='on'){const wf=L.wf;wf.x=246*T;wf.st='idle';wf.t=0;wf.face=-1;wf.rot=0;}
  setState('play');startSong();updCam(true);}
function bumpTile({tx,ty}){const c=L.g[ty][tx];
  if(c==='X'||c==='Q'||c==='R'||c==='M'){L.bumpA={tx,ty,t:8};sfx('crate');
    if(c==='M'){const k=tx+','+ty;L.multi[k]=(L.multi[k]||0)+1;addEgg(1);parts.push({kind:'eggpop',x:tx*T+16,y:ty*T-4,vx:0,vy:-4,life:30});
      if(L.multi[k]>=5){L.g[ty][tx]='U';spawnEggFountain(tx*T+16,ty*T,4);popText('JACKPOT!',tx*T+16,ty*T-30,'#ffd23f',true);}else popText((5-L.multi[k])+' more!',tx*T+16,ty*T-24,'#fff');}
    else{L.g[ty][tx]='U';
      if(c==='X'){const hidden=L.hints.some(h=>Math.abs(h.x-(tx*T+16))<4&&Math.abs(h.y-(ty*T+16))<4);
        if(hidden){spawnEggFountain(tx*T+16,ty*T,10);popText('SECRET CRATE!',tx*T+16,ty*T-30,'#ff9fd6',true);sfx('secret');confetti(tx*T+16,ty*T,16);L.hints=L.hints.filter(h=>!(Math.abs(h.x-(tx*T+16))<4&&Math.abs(h.y-(ty*T+16))<4));}
        else{addEgg(1);parts.push({kind:'eggpop',x:tx*T+16,y:ty*T-4,vx:0,vy:-4,life:30});}}
      else L.items.push({t:c==='Q'?'hat':'heart',x:tx*T+3,y:ty*T,w:26,h:22,rise:30});}
    for(const e of L.ents)if(e.alive&&!e.saddle&&e.x<tx*T+T&&e.x+e.w>tx*T&&Math.abs(e.y+e.h-ty*T)<6)killEnemy(e);}
  else sfx('bump');}
function killEnemy(e){if(!e.alive)return;e.alive=false;e.dead=0;
  if(e.t==='pumpkin'){e.gone=true;sfx('splat');burst(e.x+13,e.y+13,'#f08a24',12);}
  else{burst(e.x+e.w/2,e.y+e.h/2,'#ffffff',8,'feather');sfx('honk');}}
function breakHay(tx,ty){const seen=new Set(),st=[[tx,ty]];let n=0;
  while(st.length){const [x,y]=st.pop(),k=x+','+y;if(seen.has(k)||tileAt(x,y)!=='B')continue;seen.add(k);L.g[y][x]=' ';n++;
    for(let i=0;i<4;i++)parts.push({kind:'straw',x:x*T+16,y:y*T+16,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:50,r:Math.random()*6});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  if(n){sfx('straw');shake=6;popText('Something’s behind the hay!',tx*T+16,ty*T-40,'#fff',true);}}
/* ---------- goose ride ---------- */
function startGooseRide(e){e.gone=true;P.ride={t:EASY()?780:600,flaps:0};P.y-=20;P.h+=20;P.vy=-6;sfx('honk');setTimeout(()=>sfx('yeehaw'),150);

  popText(hit?'Goose bailed!':'Bye, goose!',P.x+P.w/2,P.y-20,'#fff');}
/* ---------- Dill's burrows and secret doors ---------- */
function startWarp(bw,dir){dir=dir||1;P.warp={t:0,bw,phase:'dive',dir};P.vx=0;P.vy=0;P.x=(dir>0?bw.x:bw.ex)-P.w/2;P.y=bw.y-P.h;sfx('dig');if(P.ride)endGooseRide(false);}
function stepWarp(){const w=P.warp,bw=w.bw;w.t++;
  if(w.phase==='dive'){P.sink=Math.min(1,w.t/18);if(w.t>=18){w.t=0;if(bw.kind==='tunnel'){w.phase='travel';}else{w.phase='fade';flash=.8;}}}
  else if(w.phase==='travel'){P.sink=1;const sp=3.3,d=w.dir;P.x+=sp*d;P.face=d;if(d>0)L.dug[bw.x]=Math.max(L.dug[bw.x]||0,P.x+P.w/2+30);if(frame%14===0)sfx('dig');
    for(const j of bw.junk)if(!j.said&&Math.abs(P.x+P.w/2-(j.x+16))<16){j.said=1;burst(j.x+16,GY+76,'#fff6c8',8,'star');if(j.kind==='coin')addEgg(5);if(!purse[j.kind])collectJunk(j.kind,j.x+16,GY+76);}
    const end=d>0?bw.ex:bw.x;if((d>0&&P.x+P.w/2>=end)||(d<0&&P.x+P.w/2<=end)){P.x=end-P.w/2;w.phase='rise';w.t=0;sfx('pop');burst(end,GY,'#8a5a2e',14);}}
  else if(w.phase==='fade'){if(w.t>=12){const to=bw.to;P.zone=to.zone;P.x=to.x-P.w/2;P.y=to.y-P.h;w.phase='rise';w.t=0;w.bw={x:to.x,y:to.y};G.x=P.x-36;G.y=to.y-G.h;G.vy=0;updCam(true);
      if(bw.secret){const first=!L.secrets[bw.secret];L.secrets[bw.secret]=1;sfx('secret');confetti(P.x,P.y-20,40);if(first){showBanner('SECRET CAVE!','Dill found a treasure cave','#7dff8a');L.showerAt=frame+80;}else startShower(false);}else sfx('pop');}}
  else if(w.phase==='rise'){P.sink=Math.max(0,1-w.t/18);if(w.t>=18){P.warp=null;P.sink=0;P.vy=-8;P.safe={x:P.x,y:P.y};L.lockX=P.x;G.x=P.x-36;G.y=P.y+P.h-G.h;G.vy=0;}}
  updCam();}
function startShower(big){L.shower={t:0,dur:big?600:260,zone:P.zone};showBanner('EGG SHOWER!','Catch the sparkly eggs!','#ff9fd6');}
function eggPop(it){const c=RCOL[it.c];sfx('sparkle');parts.push({kind:'ring',x:it.x+10,y:it.y+12,c,life:18,vx:0,vy:0});for(let i=0;i<10;i++){const a=i/10*Math.PI*2;parts.push({kind:'star',x:it.x+10,y:it.y+12,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,life:24,c:i%2?c:'#ffffff'});}}
let purse=store.get('purse',{})||{};

function updPurseBadge(){const n=purseCount();document.getElementById('purseN').textContent=n?n:'';}
function collectJunk(k,wx,wy){purse[k]=1;store.set('purse',purse);sfx('secret');updPurseBadge();
  const sx=(wx-cam.x)*ZM,sy=(wy-cam.y)*ZM;parts.push({kind:'tojunk',k,screen:true,x:sx,y:sy,x0:sx,y0:sy,life:60,vx:0,vy:0});

function useDoor(d){sfx('door');flash=.8;const to=d.to;P.zone=to.zone;P.x=to.x-P.w/2;P.y=to.y-P.h;P.vx=0;P.vy=0;G.x=P.x-36;G.y=to.y-G.h;G.vy=0;L.doorLock=40;L.lockX=P.x;updCam(true);

function stepGoat(){
  if(pressed('butt')&&G.mode==='walk'&&!P.mount){G.mode='dash';G.dt=34;G.face=P.face;G.x=P.x+P.w/2-G.w/2;G.y=P.y+P.h-G.h;G.vy=0;sfx('butt');popText('HEADBUTT!',G.x+G.w/2,G.y-26,'#ffe9b8');}
  if(G.mode==='dash'){G.vx=G.face*9;G.vy=Math.min(G.vy+.6,12);moveX(G);moveY(G);
    if(frame%2===0)parts.push({kind:'dust',x:G.x+G.w/2-G.face*14,y:G.y+G.h,vx:-G.face,vy:-.4,life:16});
    if(G.hitW&&G.hitTile&&tileAt(G.hitTile.tx,G.hitTile.ty)==='B')breakHay(G.hitTile.tx,G.hitTile.ty);
    if(--G.dt<=0||G.hitW||G.y>ROWS*T){if(G.hitW){sfx('bump');burst(G.x+G.w/2+G.face*14,G.y+10,'#fff',5,'star');}G.mode='walk';}}
  else{const tx=P.x+P.w/2-P.face*34-G.w/2,dx=tx-G.x;
    if(Math.abs(dx)>6){G.vx=Math.max(-9,Math.min(9,dx*.14));G.face=Math.sign(G.vx)||G.face;}else{G.vx*=.7;if(Math.abs(G.vx)<.2)G.face=P.face;}
    G.vy=Math.min(G.vy+.7,13);moveX(G);if(G.hitW&&G.onG)G.vy=-11;moveY(G);
    if(G.onG&&Math.abs(G.vx)>1){const ax=G.vx>0?G.x+G.w+4:G.x-4;if(!solidAt(Math.floor(ax/T),Math.floor((G.y+G.h+4)/T))&&tileAt(Math.floor(ax/T),Math.floor((G.y+G.h+4)/T))!=='-')G.vy=-11;}
    if(Math.hypot(G.x-P.x,G.y-P.y)>320||G.y>ROWS*T){G.x=P.x-P.face*30;G.y=P.y+P.h-G.h;G.vy=0;burst(G.x+G.w/2,G.y+G.h/2,'#fff',6);}}
  G.anim+=Math.max(.15,Math.abs(G.vx)*.09);}

function stepPlay(){
  if(P.warp){stepWarp();stepGoat();return;}
  if(L.doorLock>0)L.doorLock--;
  if(P.mount){stepWaffles();updCam();return;}
  const goL=inp.left&&!inp.right,goR=inp.right&&!inp.left,riding=!!P.ride;
  // running: quick start, and a turbo scurry after holding a direction
  if((goL||goR)&&P.onG)P.holdT++;else if(!(goL||goR))P.holdT=0;
  const turbo=P.holdT>60;if(turbo&&!P.turboOn){P.turboOn=true;popText('TURBO!',P.x+P.w/2,P.y-20,'#7fe3ff');sfx('whoosh');}if(!turbo)P.turboOn=false;
  const max=(riding?5.8:turbo?6.2:4.6)*(EASY()?.88:HARD()?1.12:1),acc=P.onG?.65:.45;
  if(goL){P.face=-1;P.vx=Math.max(P.vx-acc,-max);}else if(goR){P.face=1;P.vx=Math.min(P.vx+acc,max);}
  else{P.vx*=P.onG?.72:.94;if(Math.abs(P.vx)<.08)P.vx=0;}
  if(pressed('jump'))P.buf=8;else if(P.buf>0)P.buf--;
  if(P.onG)P.coy=7;else if(P.coy>0)P.coy--;
  const wasAir=!P.onG;
  // hold jump to keep bouncing
  if((P.buf>0||(inp.jump&&P.onG&&P.landT>2))&&P.coy>0){P.vy=EASY()?-15.4:-15;P.buf=0;P.coy=0;P.jumping=true;P.sq=-1;sfx('jump');parts.push({kind:'dust',x:P.x+P.w/2,y:P.y+P.h,vx:0,vy:-.3,life:14});}
  else if(riding&&pressed('jump')&&!P.onG&&P.ride.flaps<4){P.ride.flaps++;P.vy=-9.5;sfx('flap');for(let i=0;i<3;i++)parts.push({kind:'feather',x:P.x+P.w/2,y:P.y+P.h-6,vx:(Math.random()-.5)*3,vy:Math.random()*2,life:40,r:Math.random()*6});}
  if(P.jumping&&!inp.jump&&P.vy<-6)P.vy=-6;if(P.vy>=0)P.jumping=false;
  const gUp=EASY()?.82:.8,gDown=EASY()?.95:HARD()?1.25:1.1;
  P.vy=Math.min(P.vy+(P.vy<0?gUp:gDown),EASY()?12:15);
  if(riding&&inp.jump&&P.vy>2.2)P.vy=2.2;
  moveX(P);moveY(P);
  if(P.onG){if(wasAir){P.sq=1;P.landT=0;P.chain=0;sfx('land');parts.push({kind:'dust',x:P.x+P.w/2-8,y:P.y+P.h,vx:-1,vy:-.4,life:14},{kind:'dust',x:P.x+P.w/2+8,y:P.y+P.h,vx:1,vy:-.4,life:14});if(riding)P.ride.flaps=0;}P.landT=(P.landT||0)+1;}
  if(P.sq>0)P.sq=Math.max(0,P.sq-.12);else if(P.sq<0)P.sq=Math.min(0,P.sq+.1);
  if(P.bump)bumpTile(P.bump);
  if(L.bumpA&&--L.bumpA.t<=0)L.bumpA=null;
  if(P.onG){P.anim+=Math.abs(P.vx)*.09;if(turbo&&frame%3===0)parts.push({kind:'dust',x:P.x+P.w/2-P.face*10,y:P.y+P.h,vx:-P.face*1.5,vy:-.5,life:16});
    const fy=Math.floor((P.y+P.h)/T),ok=c=>solidC(c)||c==='-';if(ok(tileAt(Math.floor((P.x+2)/T),fy))&&ok(tileAt(Math.floor((P.x+P.w-2)/T),fy))&&!L.chase&&P.zone===0)P.safe={x:P.x,y:P.y};}
  if(P.inv>0)P.inv--;
  if(L.comboT>0){L.comboT--;if(L.comboT===0)L.combo=0;}
  if(L.hudPop>0)L.hudPop--;
  if(L.showerAt&&frame>=L.showerAt){L.showerAt=0;if(P.zone>0)startShower(true);}
  if(L.shower){const sh=L.shower;sh.t++;if(P.zone!==sh.zone)L.shower=null;else{const z=ZONES[sh.zone];
    if(sh.t<sh.dur&&sh.t%5===0)L.items.push({t:'reg',c:Math.floor(Math.random()*6),x:z.x0+2*T+Math.random()*(z.x1-z.x0-4*T),y:4*T+2,w:20,h:24,vx:(Math.random()-.5)*1.2,vy:.4+Math.random(),phys:true,grav:.05,maxv:2.3,age:99,life:540,ph:Math.random()*6});
    if(sh.t<sh.dur&&sh.t%10===0)sfx('twinkle');if(sh.t>sh.dur+60)L.shower=null;}}
  if(riding){P.ride.t--;if(frame%4===0&&Math.abs(P.vx)>2)parts.push({kind:'dust',x:P.x+P.w/2-P.face*12,y:P.y+P.h,vx:-P.face,vy:-.4,life:14});if(P.ride.t<=0)endGooseRide(false);}
  if(P.y>ROWS*T+20){fallPit();return;}
  if(state!=='play')return;
  // Dill's burrows and secret doors: stand on one and press DOWN
  L.near=null;
  if(P.onG&&!L.chase){const cx=P.x+P.w/2,onY=y=>Math.abs(P.y+P.h-y)<3;
    for(const bw of L.burrows){if(bw.exitOnly&&P.zone!==2)continue;if(!bw.exitOnly&&P.zone!==0)continue;
      if(Math.abs(cx-bw.x)<22&&onY(bw.y)){L.near={kind:'burrow',bw,dir:1,x:bw.x,y:bw.y,exit:!!bw.exitOnly};break;}
      if(bw.kind==='tunnel'&&Math.abs(cx-bw.ex)<22&&onY(bw.y)){L.near={kind:'burrow',bw,dir:-1,x:bw.ex,y:bw.y,exit:false};break;}}
    if(!L.near)for(const d of L.doors){if(d.need&&L.g[13][d.need[0]+1]==='B')continue;if((d.to.zone===0)!==(P.zone!==0))continue;if(overlap(P,d)){L.near={kind:'door',d,x:d.x+d.w/2,y:d.y+d.h,exit:d.to.zone===0};break;}}
    if(L.lockX!=null&&Math.abs(P.x-L.lockX)>=40)L.lockX=null;
    if(L.near&&L.near.exit&&!L.hinted.down){L.hinted.down=1;popText(isTouch?'Press ⬇ to hop out!':'Press DOWN to hop out!',L.near.x,L.near.y-110,'#ffe9b8',true);}
    if(L.near&&!L.near.exit&&L.lockX==null){const n=L.near;L.near=null;if(n.kind==='door'){useDoor(n.d);return;}if(n.dir<0&&!L.dug[n.bw.x])L.dug[n.bw.x]=n.bw.ex;startWarp(n.bw,n.dir);return;}
    if(L.near&&pressed('down')){const n=L.near;L.near=null;if(n.kind==='door'){useDoor(n.d);return;}if(n.dir<0&&!L.dug[n.bw.x])L.dug[n.bw.x]=n.bw.ex;startWarp(n.bw,n.dir);return;}}
  for(const h of L.hints)if(h.kind==='hen'&&!L.hinted.hen&&Math.abs(P.x-h.x)<170&&L.g[13][127]==='B'){L.hinted.hen=1;}
  stepGoat();
  if(L.runner){const r=L.runner;r.t++;r.x+=6;if(r.t===8)sfx('moo');if(r.x>cam.x+W/ZM+300)L.runner=null;}
  for(const s of L.spawners){const dx=s.x-P.x;if(dx>90&&dx<800&&--s.cd<=0){s.cd=HARD()?160:EASY()?320:230;L.ents.push(E('pumpkin',s.x,s.y,26,26,{vx:EASY()?-1.3:HARD()?-2:-1.7}));}}
  for(const e of L.ents){if(!e.alive){e.dead++;continue;}
    if(e.t==='goose'&&(e.x<cam.x-300||e.x>cam.x+W/ZM+300))continue;
    e.t0++;if(e.honkT>0)e.honkT--;
    if(e.t==='goose'){e.vy=Math.min(e.vy+.5,10);const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;moveY(e);
      if(e.onG){const ax=e.vx>0?e.x+e.w+2:e.x-2;const c=tileAt(Math.floor(ax/T),Math.floor((e.y+e.h+4)/T));if(!solidC(c)&&c!=='-')e.vx=-e.vx;}
      if(!e.saddle&&Math.abs(e.x-P.x)<260&&e.t0%150===0){e.honkT=40;sfx('honk');}
      if(e.y>ROWS*T+40)e.gone=true;}
    else if(e.t==='pumpkin'){e.vy=Math.min(e.vy+.5,10);moveX(e);if(e.hitW){killEnemy(e);continue;}moveY(e);e.rot+=e.vx/13;if(e.y>ROWS*T+40)e.gone=true;}
    if(G.mode==='dash'&&!e.saddle&&overlap(G,e)){killEnemy(e);sfx('bonk');popText(e.t==='goose'?'BONK!':'SPLAT!',e.x+e.w/2,e.y-10,'#fff');addEgg(1);continue;}
    if(overlap(P,e)){
      if(e.saddle){if(!riding&&P.vy>0&&P.y+P.h-P.vy<=e.y+14){startGooseRide(e);continue;}continue;}
      if(riding){killEnemy(e);P.vy=Math.min(P.vy,-6);addEgg(1);continue;}
      if(P.vy>0&&P.y+P.h-P.vy<=e.y+12){killEnemy(e);P.vy=inp.jump?-12:-9;P.jumping=inp.jump;sfx('stomp');P.chain++;
        if(P.chain>=2){const words=['','','DOUBLE!','TRIPLE!','QUAD!'];popText((words[P.chain]||'MEGA!')+' +'+P.chain,P.x+P.w/2,P.y-26,'#7fe3ff',true);for(let k=0;k<P.chain;k++)addEgg(1);}else addEgg(1);continue;}
      hurt(e.x+e.w/2);if(state!=='play')return;}}
  L.ents=L.ents.filter(e=>!e.gone&&!(!e.alive&&e.dead>40));
  // items
  for(const it of L.items){
    if(it.life!=null&&--it.life<=0){it.got=true;continue;}
    if(it.phys){it.age++;it.vy=Math.min(it.vy+(it.grav||.5),it.maxv||10);if(it.t==='reg')it.x+=Math.sin(frame*.05+it.ph)*.4;moveX(it);if(it.hitW)it.vx*=-.5;const vy=it.vy;moveY(it);if(it.onG){it.vy=vy>2?-vy*.45:0;it.vx*=.85;}}
    if((it.t==='hat'||it.t==='heart')&&it.rise>0){it.y-=1;it.rise--;}
    const pad=it.t==='egg'||it.t==='gold'||it.t==='reg'?12:5;
    if(overlap(P,{x:it.x-pad,y:it.y-pad,w:it.w+pad*2,h:it.h+pad*2})&&!(it.rise>12)&&!(it.phys&&it.age<12)){it.got=true;
      if(it.t==='egg')addEgg(1,it.x+10,it.y+12);
      else if(it.t==='reg'){addEgg(1);eggPop(it);}
      else if(it.t==='junk'){if(!purse[it.kind])collectJunk(it.kind,it.x+13,it.y+12);burst(it.x+13,it.y+12,'#fff6c8',10,'star');}
      else if(it.t==='gold')goldGot(it);
      else if(it.t==='hat'){if(!P.hat){P.hat=true;sfx('hat');popText('Cowboy hat! One free bump.',P.x+P.w/2,P.y-20,'#ffe9b8');}else{addEgg(3);popText('+3 eggs',P.x+P.w/2,P.y-20);}}
      else if(it.t==='heart'){P.hearts=Math.min(MAXH(),P.hearts+1);sfx('heart');burst(it.x+12,it.y+10,'#ff4f7a',8);}}}
  L.items=L.items.filter(i=>!i.got&&i.y<ROWS*T+40&&!(i.t==='junk'&&purse[i.kind]));

function stepWaffles(){const wf=L.wf;wf.t++;const lo=ARL,hi=ARR;const spd=(EASY()?2.4:HARD()?4.4:3.2)+L.rides*.35;
  if(wf.st==='ridden'){const Rd=L.rodeo;Rd.t++;wf.x+=wf.face*3;if(wf.x<lo+4){wf.x=lo+4;wf.face=1;}if(wf.x+wf.w>hi-4){wf.x=hi-4-wf.w;wf.face=-1;}
    if(Rd.phase==='calm'){wf.y=GY-wf.h-Math.abs(Math.sin(wf.t*.12))*5;wf.rot=Math.sin(wf.t*.15)*.05;if(Rd.t>=Rd.wait){Rd.phase='warn';Rd.t=0;sfx('moo');}}
    else if(Rd.phase==='warn'){wf.y=GY-wf.h;wf.rot=Math.sin(Rd.t*.6)*.06;
      if(pressed('jump')){Rd.phase='buck';Rd.t=0;Rd.ok++;sfx('yeehaw');popText(['Yeehaw!','Hang on!','Nice!'][Rd.ok%3],P.x+P.w/2,P.y-24,'#ffd23f',true);spawnEggFountain(wf.x+wf.w/2,wf.y,2);}
      else if(Rd.t>=Rd.win){throwOff(false);return;}}
    else if(Rd.phase==='buck'){wf.y=GY-wf.h-Math.sin(Math.min(1,Rd.t/30)*Math.PI)*44;wf.rot=Math.sin(Rd.t*.45)*.32;
      if(Rd.t>=30){if(Rd.ok>=3){throwOff(true);return;}Rd.phase='calm';Rd.t=0;Rd.wait=45+Math.floor(Math.random()*40);}}
    P.x=wf.x+wf.w/2-P.w/2;P.y=wf.y-P.h+10;P.face=wf.face;P.vx=0;P.vy=0;
    return;}
  if(wf.st==='idle'){if(wf.t>(EASY()?60:40)){wf.st='paw';wf.t=0;wf.face=(P.x+P.w/2>wf.x+wf.w/2)?1:-1;}}
  else if(wf.st==='paw'){if(frame%5===0)parts.push({kind:'dust',x:wf.x+wf.w/2-wf.face*30,y:wf.y+wf.h,vx:-wf.face*.8,vy:-.6,life:18});
    if(wf.t>(EASY()?80:HARD()?38:58)){wf.st='charge';wf.t=0;sfx('moo');}}
  else if(wf.st==='charge'){wf.x+=wf.face*spd;if(frame%3===0)parts.push({kind:'dust',x:wf.x+wf.w/2-wf.face*36,y:wf.y+wf.h,vx:-wf.face,vy:-.5,life:18});
    if(wf.x<lo){wf.x=lo;bonkWall();}else if(wf.x+wf.w>hi){wf.x=hi-wf.w;bonkWall();}}
  else if(wf.st==='bonk'||wf.st==='dizzy'){if(wf.t>(wf.st==='dizzy'?100:55)){wf.st='idle';wf.t=0;}}
  if(G.mode==='dash'&&wf.st!=='dizzy'&&overlap(G,wf)){wf.st='dizzy';wf.t=0;G.mode='walk';sfx('bonk');shake=6;popText('Dizzy Waffles! Hop on!',wf.x+wf.w/2,wf.y-40,'#fff',true);}
  if(L.mountLock>0)L.mountLock--;
  if(overlap(P,{x:wf.x+6,y:wf.y+4,w:wf.w-12,h:wf.h-4})&&!P.mount){
    if(P.vy>0&&P.y+P.h-P.vy<=wf.y+16){if(L.mountLock>0){P.vy=-10;sfx('boing');return;}P.mount='cow';wf.st='ridden';wf.t=0;L.rodeo={phase:'calm',t:0,wait:40,ok:0,win:EASY()?72:HARD()?34:50};sfx('yeehaw');shake=4;showBanner('YEEHAW!','Now tap JUMP every time you see TAP!','#ffffff');}
    else if(wf.st==='charge'||wf.st==='paw'||wf.st==='idle')hurt(wf.x+wf.w/2);}}
function drawJumpOn(){const wf=L.wf;if(L.chase!=='on'||P.mount||wf.hidden)return;const b=Math.abs(Math.sin(frame*.12))*10,x=wf.x+wf.w/2,y=wf.y-58-b;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.lineTo(x,y+16);ctx.closePath();ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=OL;ctx.stroke();txt('Jump on!',x,y-14,13,'#fff',OL,4);}
function throwOff(ok){const wf=L.wf;P.mount=null;wf.rot=0;wf.y=GY-wf.h;P.vy=-14;P.vx=-wf.face*3;P.inv=60;L.mountLock=80;shake=8;jumpGlow(false);

function updCam(snap){const chase=!!L.chase&&P.zone===0;const zt=chase?1:zoomBase();ZM=snap?zt:ZM+(zt-ZM)*.06;if(Math.abs(ZM-zt)<.002)ZM=zt;const VW=W/ZM,VH=H/ZM;
  const z=ZONES[P.zone],zw=z.x1-z.x0;let ct=P.x+P.w/2-VW*.4+P.face*Math.min(50,Math.abs(P.vx)*8);if(chase)ct=z.x1-VW;
  ct=zw<=VW?z.x0-(VW-zw)/2:Math.max(z.x0,Math.min(z.x1-VW,ct));cam.x=snap?ct:cam.x+(ct-cam.x)*.12;

function runStory(lines,done,id){const seen=store.get('seen',{})||{};story={lines:lines.map(l=>({who:speaker(l.who),scene:l.scene||'level',text:l.text})),i:0,ch:0,done,id,skip:!!id};setState('story');}

  story.i++;story.ch=0;stateT=0;if(story.i>=story.lines.length)endStory();}

function stepStory(){const ln=story.lines[story.i];if(story.ch<ln.text.length){const b=Math.floor(story.ch/3);story.ch+=1.4;if(Math.floor(story.ch/3)!==b)sfx('talk');}}
let DLG={next:null,back:null,skip:null};
function userGo(src){
  if(state==='story'&&story&&stateT>6){const ln=story.lines[story.i];
    if(src==='tap'&&story.skip&&inR(tap,DLG.skip)){sfx('whoosh');endStory();return;}
    if(src==='tap'&&inR(tap,DLG.back)){storyBack();return;}
    if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
    if(src==='tap'&&!inR(tap,DLG.next)&&stateT<25)return;

/* ---------------- step ---------------- */
function step(){frame++;stateT++;tickSong();
  if(L&&L.esc&&state!=='escape'&&L.giant.crashed&&L.giant.x<L.w*T+400){const pk=L.giant;pk.x+=pk.vx;pk.rot+=pk.vx/pk.r;}
  if(banner&&++banner.t>130)banner=null;if(flash>0)flash=Math.max(0,flash-.05);
  switch(state){
    case 'title':stepTitle();break;
    case 'story':stepStory();break;
    case 'card':if(tap&&inR(tap,BACKR())){goTitle();break;}if(stateT>30&&(pressed('jump')||pressed('ok')||tap))setState('play');else if(stateT>300)setState('play');break;
    case 'play':stepPlay();break;
    case 'escape':stepEscape();break;
    case 'oneMore':if(stateT>40){const b=endButtons();if(tap&&inR(tap,b[1]))goTitle();else if(pressed('jump')||pressed('ok')||(tap&&inR(tap,b[0])))respawn();}break;
    case 'clear':if(stateT>60){const b=endButtons();if(tap&&inR(tap,b[1]))goTitle();else if(pressed('ok')||(tap&&inR(tap,b[0])))newGame(true);}break;}
  syncCtl();
  for(const k in inp)prevInp[k]=inp[k];tap=null;
  for(const p of parts){p.x+=p.vx||0;p.y+=p.vy||0;const gk={dot:.22,straw:.25,splinter:.22,hat:.22,eggpop:.22,conf:.18,feather:.06,flygoose:-.08}[p.kind];if(gk)p.vy+=gk;if(p.kind==='conf'||p.kind==='straw')p.vx*=.98;p.life--;}
  parts=parts.filter(p=>p.life>0);if(shake>0)shake-=.5;}

  for(const h of L.hints){if(h.kind==='sparkle'&&frame%90<30){ctx.fillStyle='#fff7c2';ctx.fillRect(h.x-1+Math.sin(frame*.2)*6,h.y-1,3,3);}
    if(h.kind==='hen'&&L.g[13][127]==='B'){drawSpr(HEN,13,21,h.x+48,h.y+2+Math.round(Math.abs(Math.sin(frame*.05))*-6),1,.9,.9);
      if(P.zone===0&&Math.abs(P.x-h.x)<420){const bx=h.x+64,by=h.y-62+Math.sin(frame*.08)*3,t1='Psst! This hay is loose…',t2='Headbutt it with 🐐!';ctx.font=`800 15px ${FONT}`;const bw=Math.max(ctx.measureText(t1).width,ctx.measureText(t2).width)+28;
        rr(bx-bw/2,by-26,bw,52,14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.stroke();ctx.beginPath();ctx.moveTo(bx-28,by+25);ctx.lineTo(bx-16,by+40);ctx.lineTo(bx-6,by+25);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillRect(bx-27,by+22,20,4);
        txt(t1,bx,by-9,15,OL);txt(t2,bx,by+11,15,'#c4392d');}}}
  for(const bw of L.burrows){if((bw.exitOnly&&P.zone!==2)||(!bw.exitOnly&&P.zone!==0))continue;
    drawSpr(MOUND,24,13,bw.x,bw.y+3,1);if(bw.kind==='tunnel')drawSpr(MOUND,24,13,bw.ex,bw.y+3,1);
    const wk=P.warp&&P.warp.bw===bw;if(!wk&&Math.abs(P.x-bw.x)<300){ctx.save();ctx.beginPath();ctx.rect(bw.x-40,bw.y-60,80,58);ctx.clip();drawSpr(dillSpr('stand'),18,21,bw.x+4,bw.y+6+Math.round(Math.sin(frame*.1)*3),-1);ctx.restore();}
    if(bw.kind==='room'&&!bw.exitOnly&&frame%40<20){ctx.fillStyle='#fff7c2';ctx.fillRect(bw.x-20,bw.y-30,3,3);ctx.fillRect(bw.x+18,bw.y-22,3,3);}}
  if(L.near&&!P.warp&&L.near.exit){const b=Math.abs(Math.sin(frame*.15))*8,x=L.near.x,y=L.near.y-(L.near.kind==='door'?84:P.h+40)-b;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.lineTo(x,y+16);ctx.closePath();ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=OL;ctx.stroke();rr(x-6,y-14,12,14,3);ctx.fill();ctx.stroke();}
  for(const it of L.items)drawItem(it);
  for(const e of L.ents){if(e.t==='goose')drawGoose(e);else{ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.rotate(e.rot);ctx.drawImage(PUMP[0],-16,-15,32,26);ctx.restore();}}
  if(L.runner)drawSpr(cowSpr(Math.floor(frame/4)%2?'walk1':'walk2'),52,75,L.runner.x,GY,1,.9,.9);
  if(P.zone===0&&(L.chase||P.x>205*T)){drawWaffles();drawJumpOn();}
  drawFollower();drawPlayer();drawParts(false);
  ctx.fillStyle='#120a06';ctx.fillRect(z.x0-3000,-500,3000,H+1000);ctx.fillRect(z.x1,-500,3000,H+1000);
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.6})`;ctx.fillRect(0,0,W,H);}
  drawHUD();drawParts(true);}
function panel(w,h){const x=W/2-w/2,y=H/2-h/2-20;rr(x,y,w,h,24);ctx.fillStyle='rgba(255,250,240,.97)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();return {x,y};}
function endButtons(){return [{x:W/2-230,y:H/2+104,w:220,h:62},{x:W/2+10,y:H/2+104,w:220,h:62}];}
function drawOneMore(){ctx.fillStyle='rgba(30,18,12,.45)';ctx.fillRect(0,0,W,H);const p=panel(500,250);txt('Oops!',W/2,p.y+58,48,'#e0413a',OL,7);
  txt('Back to the last scarecrow with full hearts.',W/2,p.y+112,18,OL);const b=endButtons();if(stateT>40){button(b[0],'Try again','#5fb648',false,22);button(b[1],'🏠 Home','#c4392d',false,22);}}
function drawClear(){ctx.fillStyle='rgba(30,18,12,.45)';ctx.fillRect(0,0,W,H);const p=panel(600,370);
  txt('World 1 complete!',W/2,p.y+46,38,'#5fb648',OL,7);
  ctx.drawImage(eggS,W/2-230,p.y+80,26,34);txt('× '+L.eggs+' eggs',W/2-196,p.y+98,26,OL,null,0,'left');
  for(let i=0;i<3;i++){ctx.globalAlpha=L.gold[i]?1:.25;ctx.drawImage(eggG,W/2+60+i*36,p.y+80,26,34);}ctx.globalAlpha=1;
  const sec=Object.keys(L.secrets).length;txt('Secrets found: '+sec+' of 2',W/2-110,p.y+150,18,'#6a5d52');txt('Best combo: '+L.bestCombo,W/2+110,p.y+150,18,'#6a5d52');
  txt('Waffles rolled off toward the barn…',W/2,p.y+192,20,OL);txt('👜 Mom’s purse: '+purseCount()+' of '+PURSE_ITEMS.length+' found (tap the purse up top)',W/2,p.y+250,15,'#c2185b');txt('Next: Hayloft Heights (coming soon!)',W/2,p.y+220,16,'#8a7f74');
  const b=endButtons();if(stateT>60){button(b[0],'Play again','#5fb648',false,22);button(b[1],'🏠 Home','#c4392d',false,22);}}
function render(){ctx.setTransform(RES,0,0,RES,0,0);ctx.imageSmoothingEnabled=false;
  switch(state){case 'title':drawTitle();break;case 'story':drawStory();break;case 'card':drawCard();break;
    case 'play':case 'escape':drawWorld();break;case 'oneMore':drawWorld();drawOneMore();break;case 'clear':drawWorld();drawClear();break;}
  if(state==='title'||state==='card'||state==='clear')drawParts(true);}

/* ---------------- menus & loop ---------------- */
let pmKind='pause';
function pauseGame(kind){if(gamePaused)return;gamePaused=true;pmKind=kind||'pause';try{if(actx&&actx.state==='running')actx.suspend();}catch(e){}
  const home=pmKind==='home';document.getElementById('pmH').textContent=home?'Go to the main menu?':'Paused';document.getElementById('pmRe').style.display=home?'none':'';
  document.getElementById('pmHome').textContent=home?'🏠 Yes, main menu':'🏠 Main menu';document.getElementById('pmGo').textContent=home?'▶ No, keep playing':'▶ Keep playing';
  document.getElementById('pm').style.display='flex';syncCtl();}
function resumeGame(silent){gamePaused=false;document.getElementById('pm').style.display='none';for(const k in inp)inp[k]=false;tap=null;try{if(actx&&!document.hidden&&!silent)actx.resume();}catch(e){}}
document.getElementById('homeB').onclick=e=>{e.stopPropagation();if(PLAYISH.includes(state))pauseGame('home');else goTitle();};
document.getElementById('pauseB').onclick=e=>{e.stopPropagation();pauseGame('pause');};
document.getElementById('pmGo').onclick=()=>resumeGame();
document.getElementById('pmRe').onclick=()=>{resumeGame();if(L){P.mount=null;if(L.chase==='escape'){goTitle();return;}respawn();}};
document.getElementById('pmHome').onclick=()=>{resumeGame();goTitle();};
let purseOpen=false,purseWasPaused=false;
function openPurse(){if(purseOpen)return;purseOpen=true;purseWasPaused=gamePaused;if(!gamePaused){gamePaused=true;try{if(actx&&actx.state==='running')actx.suspend();}catch(e){}}syncCtl();
  const n=purseCount();document.getElementById('purseSub').textContent='Stuff found on the farm: '+n+' of '+PURSE_ITEMS.length+(n<PURSE_ITEMS.length?'. Dig around for the rest!':'. Mom’s purse is officially full.');
  const g=document.getElementById('purseGrid');g.innerHTML='';
  for(const it of PURSE_ITEMS){const has=purse[it.k],d=document.createElement('div');d.className='pi'+(has?'':' no');const im=document.createElement('img');im.alt='';im.src=JUNK[it.k].toDataURL();
    const t=document.createElement('div');t.innerHTML='<b></b><small></small>';t.querySelector('b').textContent=has?it.name:'???';t.querySelector('small').textContent=has?it.d:'Still hidden somewhere…';d.append(im,t);g.appendChild(d);}
  document.getElementById('purse').style.display='flex';}
function closePurse(){purseOpen=false;document.getElementById('purse').style.display='none';if(!purseWasPaused){gamePaused=false;for(const k in inp)inp[k]=false;tap=null;try{if(actx&&!document.hidden)actx.resume();}catch(e){}}}
document.getElementById('purseB').onclick=e=>{e.stopPropagation();unlockAudio();openPurse();};
document.getElementById('purseX').onclick=()=>closePurse();
updPurseBadge();
let downShown=false;function syncDown(){const want=isTouch&&state==='play'&&!gamePaused&&!!(L&&L.near);if(want!==downShown){downShown=want;const b=document.getElementById('downBtn');b.style.display=want?'flex':'none';if(!want){inp.down=false;b.classList.remove('on');}}}
let topShown=null;function updTop(){syncDown();const k=(state==='title'?'':'h')+(PLAYISH.includes(state)?'p':'');if(k===topShown)return;topShown=k;
  document.getElementById('homeB').style.display=k.includes('h')?'':'none';document.getElementById('pauseB').style.display=k.includes('p')?'':'none';}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){if(!gamePaused)step();acc-=1000/60;}render();updTop();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
